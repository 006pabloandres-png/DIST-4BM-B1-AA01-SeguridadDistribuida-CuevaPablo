<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - AA01</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 40px auto;
            padding: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h2>Restablecer Contraseña</h2>
    <input type="email" id="email" readonly />
    <input type="password" id="nuevaPassword" placeholder="Nueva contraseña (Ej: ClaveSegura123!)" />
    <button onclick="restablecer()">Guardar nueva contraseña</button>
    <pre id="estado"></pre>

    <script>
                const params = new URLSearchParams(window.location.search);
                const inputEmail = document.getElementById('email');
                const inputPassword = document.getElementById('nuevaPassword');
                const preEstado = document.getElementById('estado');

                if (inputEmail instanceof HTMLInputElement) {
                    inputEmail.value = params.get('email') || '';
                }
                const token = params.get('token') || '';

                async function restablecer() {
                    if (!(inputEmail instanceof HTMLInputElement) || !(inputPassword instanceof HTMLInputElement) || !preEstado) {
                        return;
                    }

                    const res = await fetch('/api/auth/restablecer-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            correo: inputEmail.value,
                            token: token,
                            nuevaPassword: inputPassword.value
                        })
                    });
                    const data = await res.json();
                    preEstado.textContent = JSON.stringify(data, null, 2);
                }
    </script>
</body>
</html>
